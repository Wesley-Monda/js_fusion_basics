<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Switch Case Statement</title>
</head>
<body>
<script>
    let day = prompt("enter the day of the week",1)
    switch (+day){
        case 1:
            console.log("Rate is 200")
            break
        case 2:
            console.log("Rate is 230")
            break
        case 3:
            console.log("Rate is 270")
            break
        case 4:
            console.log("Rate is 300")
            break
        case 5:
            console.log("Rate is 320")
            break
        default:
            console.log("Invalid value")

    }
</script>
</body>
</html>
